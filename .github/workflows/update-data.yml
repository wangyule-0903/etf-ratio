name: Update index ratio data

on:
  schedule:
    # Beijing 16:00~19:00 multi-slot to reduce missed GitHub schedules
    - cron: "0 8 * * 1-5"
    - cron: "20 8 * * 1-5"
    - cron: "40 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "20 9 * * 1-5"
    - cron: "40 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [update-ratio]

permissions:
  contents: write

concurrency:
  group: update-index-ratio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and compute ratio
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update index ratio data"
            git push
          fi
